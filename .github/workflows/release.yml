name: Release

# Un tag vX.Y.Z arma el instalador de Windows, lo firma y lo publica como
# Release con latest.json: de ahí lo bajan las apps instaladas (updater).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: La versión de la app es la del tag
        shell: bash
        run: |
          app=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"([0-9][^"]*)".*/\1/')
          if [ "v$app" != "${GITHUB_REF_NAME}" ]; then
            echo "tauri.conf.json dice $app y el tag es ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Las releases del repo son inmutables: se crea en borrador, se suben los
      # archivos y recién ahí se publica.
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ github.ref_name }}
          releaseName: Apuntador ${{ github.ref_name }}
          releaseBody: Instalador de Windows. Las apps ya instaladas se actualizan solas desde Ajustes → Actualizaciones.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true

      - name: Publicar la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${{ steps.tauri.outputs.releaseId }}" -F draft=false
