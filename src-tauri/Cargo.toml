[package]
name = "wefaber-teleprompter"
version = "0.2.1"
description = "Apuntador: teleprompter por puntos que sigue lo que decís"
authors = ["Faku"]
edition = "2021"

[lib]
name = "apuntador_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16"
transcribe-rs = { version = "0.3.11", features = ["onnx"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["net", "sync", "rt", "macros", "time"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
futures-util = "0.3"
getrandom = "0.3"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
log = "0.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
# DirectML: cualquier GPU de Windows (NVIDIA, AMD, Intel) sin CUDA.
transcribe-rs = { version = "0.3.11", features = ["onnx", "ort-directml"] }

[profile.dev.package."*"]
# La inferencia en debug es inusable; las dependencias van optimizadas siempre.
opt-level = 3
